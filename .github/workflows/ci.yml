name: CI - Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore GuruPR.sln

      - name: Build
        run: dotnet build GuruPR.sln --configuration Release --no-restore
        
      # We can add Test later
